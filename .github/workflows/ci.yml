name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated pages are up to date
        run: |
          npm run pages
          git diff --exit-code -- public || (echo "::error::public/ is stale. Run 'npm run pages' and commit the result." && exit 1)
      - run: npm run lint
      - run: npm test
      - name: Production build
        run: npm run build
